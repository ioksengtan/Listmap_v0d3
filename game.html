  <style>
    /* Game-specific variables and overrides */
    :root {
      --g-surface: #f8f5f0;
      --g-surface-2: #ece8de;
      --g-ink: #2a2419;
      --g-ink-soft: #6b6250;
      --g-ink-faint: #948a72;
      --g-line: #c3b791;
      --g-accent: #9c2e22;
      --g-accent-2: #c24d34;
      --g-accent-ink: #fdf6ea;
      --g-ok: #4c6b3f;
      --g-warn: #9c2e22;
    }

    /* Right panel layout */
    .col.right#game-panel {
      font-family: 'Source Sans 3', 'Noto Sans TC', system-ui, sans-serif;
      background: var(--g-surface);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .game-hud {
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    /* Title row inside right panel */
    .game-title-block { border-bottom: 1px solid var(--g-line); padding-bottom: 14px; margin-bottom: 2px; }
    .game-title-block h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 20px; font-weight: 700; margin: 0 0 4px;
      color: var(--g-ink);
    }
    .game-title-block p { font-size: 12.5px; color: var(--g-ink-soft); margin: 0; line-height: 1.6; }
    .badge-experimental {
      display: inline-block; margin-left: 7px; padding: 1px 7px;
      border: 1px solid var(--g-accent-2); color: var(--g-accent-2);
      border-radius: 999px; font-size: 10px; font-weight: 700; vertical-align: middle;
    }

    /* Turn indicator */
    .turn-panel {
      background: #fff;
      border: 1px solid var(--g-line);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .turn-label { font-size: 11px; color: var(--g-ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
    .turn-value { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; color: var(--g-ink); }
    .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
    .dot.black { background: radial-gradient(circle at 35% 30%, #4d463a, #14110c); border: 1px solid #050403; }
    .dot.white { background: radial-gradient(circle at 35% 30%, #fdf8ec, #e7dcc0); border: 1px solid #2a2419; }

    /* Score tiles */
    .score-row { display: flex; gap: 10px; }
    .score-tile {
      flex: 1; background: #fff; border: 1px solid var(--g-line);
      border-radius: 12px; padding: 10px 12px; text-align: center;
    }
    .score-tile .side { font-size: 11.5px; color: var(--g-ink-soft); }
    .score-tile .count { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; color: var(--g-ink); }

    /* Legend */
    .legend {
      display: flex; flex-wrap: wrap; gap: 10px;
      font-size: 12px; color: var(--g-ink-soft);
      background: #fff; border: 1px solid var(--g-line); border-radius: 12px;
      padding: 12px 14px;
    }
    .legend .item { display: flex; align-items: center; gap: 5px; }
    .swatch { width: 13px; height: 13px; border-radius: 50%; flex: none; display: inline-block; }
    .swatch.empty { background: #ece8de; border: 2px solid #c3b791; }
    .swatch.black { background: radial-gradient(circle at 35% 30%, #4d463a, #14110c); border: 1.3px solid #050403; }
    .swatch.white { background: radial-gradient(circle at 35% 30%, #fdf8ec, #e7dcc0); border: 1.3px solid #2a2419; }
    .swatch.hub { background: transparent; border: 2.5px solid #c3b791; }

    /* Action buttons */
    .game-actions { display: flex; flex-direction: column; gap: 8px; }
    .game-actions button {
      font-family: 'Source Sans 3', 'Noto Sans TC', sans-serif; font-size: 14px; font-weight: 700;
      border-radius: 9px; padding: 10px 14px;
      border: 1px solid var(--g-line);
      background: var(--g-surface-2); color: var(--g-ink);
      cursor: pointer; transition: filter 0.12s ease;
      width: 100%;
    }
    .game-actions button:hover { filter: brightness(0.96); }
    .game-actions button.primary { background: var(--g-accent); border-color: var(--g-accent); color: var(--g-accent-ink); }
    .game-actions button.primary:hover { filter: brightness(1.1); }

    /* Log */
    .log-panel {
      flex: 1; background: #fff; border: 1px solid var(--g-line);
      border-radius: 12px; padding: 12px 14px;
      display: flex; flex-direction: column; min-height: 0;
    }
    .log-panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--g-ink-faint); margin: 0 0 8px; font-weight: 700; }
    #log { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 220px; display: flex; flex-direction: column; gap: 5px; }
    #log li { font-size: 12.5px; line-height: 1.5; padding: 6px 10px; border-radius: 7px; background: var(--g-surface); color: var(--g-ink-soft); }
    #log li.event-capture { color: var(--g-ok); }
    #log li.event-illegal { color: var(--g-warn); }
    #log li:first-child { color: var(--g-ink); }

    /* Score overlay */
    .overlay { position: fixed; inset: 0; background: rgba(20,16,10,0.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .overlay[hidden] { display: none; }
    .score-sheet { background: #fff; border: 1px solid var(--g-line); border-radius: 16px; padding: 26px 28px; max-width: 400px; width: 100%; box-shadow: 0 24px 60px -20px rgba(30,24,12,0.28); }
    .score-sheet h2 { font-family: 'Fraunces', serif; font-size: 22px; margin: 0 0 4px; color: var(--g-ink); }
    .score-sheet .sub { color: var(--g-ink-soft); font-size: 13px; margin-bottom: 18px; }
    table.tally { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    table.tally th, table.tally td { text-align: right; padding: 6px 4px; font-size: 14px; border-bottom: 1px solid var(--g-line); }
    table.tally th:first-child, table.tally td:first-child { text-align: left; font-weight: 700; }
    table.tally thead th { font-weight: 700; color: var(--g-ink-faint); font-size: 12px; }
    .verdict { font-family: 'Fraunces', serif; font-weight: 700; font-size: 17px; text-align: center; padding: 10px 0 18px; color: var(--g-accent-2); }
    .score-sheet .btn-close-score {
      font-family: 'Source Sans 3', 'Noto Sans TC', sans-serif; font-size: 14px; font-weight: 700;
      border-radius: 9px; padding: 10px 14px;
      background: var(--g-accent); border: 1px solid var(--g-accent); color: var(--g-accent-ink);
      cursor: pointer; width: 100%;
    }

    /* Leaflet city tooltip */
    .leaflet-tooltip.city-tip {
      font-family: 'Source Sans 3', 'Noto Sans TC', sans-serif; font-weight: 700; font-size: 11.5px;
      background: #fff; color: var(--g-ink); border: 1px solid var(--g-line);
      padding: 1px 5px; box-shadow: none;
    }
  </style>

<script>
(function () {
  // 座標為現代對應縣市中心點的概略值，用於實驗性展示，非精確歷史治所座標。
  var CITIES = [
    { id: "youzhou",       name: "幽州", lat: 39.9042, lng: 116.4074, hub: true },
    { id: "jizhou",        name: "薊州", lat: 40.0455, lng: 117.4048 },
    { id: "zhuozhou",      name: "涿州", lat: 39.4855, lng: 115.9723 },
    { id: "tanzhou",       name: "檀州", lat: 40.3755, lng: 116.8434 },
    { id: "shunzhou",      name: "順州", lat: 40.1300, lng: 116.6540 },
    { id: "yingzhou_he",   name: "瀛州", lat: 38.4437, lng: 116.0891 },
    { id: "mozhou",        name: "莫州", lat: 38.7100, lng: 116.1300 },
    { id: "xinzhou",       name: "新州", lat: 40.3823, lng: 115.2179 },
    { id: "guizhou",       name: "媯州", lat: 40.4076, lng: 115.5089 },
    { id: "ruzhou",        name: "儒州", lat: 40.4649, lng: 115.9750 },
    { id: "wuzhou",        name: "武州", lat: 40.6086, lng: 115.0400 },
    { id: "yunzhou",       name: "雲州", lat: 40.0768, lng: 113.3001, hub: true },
    { id: "yingzhou_ying", name: "應州", lat: 39.5522, lng: 113.1888 },
    { id: "huanzhou",      name: "寰州", lat: 39.5478, lng: 112.8266 },
    { id: "shuozhou",      name: "朔州", lat: 39.3316, lng: 112.4330 },
    { id: "weizhou",       name: "蔚州", lat: 39.8378, lng: 114.5686, hub: true }
  ];
  var EDGES = [
    ["youzhou", "jizhou"], ["youzhou", "zhuozhou"], ["youzhou", "tanzhou"], ["youzhou", "shunzhou"],
    ["tanzhou", "shunzhou"], ["jizhou", "shunzhou"],
    ["zhuozhou", "mozhou"], ["mozhou", "yingzhou_he"], ["zhuozhou", "yingzhou_he"],
    ["youzhou", "ruzhou"], ["ruzhou", "guizhou"], ["guizhou", "xinzhou"],
    ["xinzhou", "wuzhou"], ["wuzhou", "yunzhou"],
    ["yunzhou", "shuozhou"], ["shuozhou", "huanzhou"], ["huanzhou", "yingzhou_ying"],
    ["yingzhou_ying", "weizhou"], ["xinzhou", "weizhou"], ["zhuozhou", "weizhou"],
    ["yunzhou", "yingzhou_ying"]
  ];

  var STYLE = {
    empty:  { fillColor: "#ece8de", color: "#c3b791", fillOpacity: 1 },
    black:  { fillColor: "#14110c", color: "#050403", fillOpacity: 1 },
    white:  { fillColor: "#fdf8ec", color: "#2a2419", fillOpacity: 1 },
    hoverEmpty: { color: "#c24d34" },
    lastMoveBlack: "#d8c9a3",
    lastMoveWhite: "#2a2419"
  };

  var neighbors = {};
  CITIES.forEach(function (c) { neighbors[c.id] = []; });
  EDGES.forEach(function (e) {
    neighbors[e[0]].push(e[1]);
    neighbors[e[1]].push(e[0]);
  });
  var order = CITIES.map(function (c) { return c.id; });
  var cityById = {};
  CITIES.forEach(function (c) { cityById[c.id] = c; });

  var board = {};
  order.forEach(function (id) { board[id] = null; });
  var turn = "black";
  var captures = { black: 0, white: 0 };
  var snapshotHistory = [snapshotOf(board)];
  var lastMove = null;
  var gameOver = false;

  function snapshotOf(b) {
    return order.map(function (id) { return b[id] ? b[id][0] : "-"; }).join("");
  }
  function cloneBoard(b) {
    var out = {};
    order.forEach(function (id) { out[id] = b[id]; });
    return out;
  }
  function getGroup(b, startId) {
    var color = b[startId];
    var stones = new Set([startId]);
    var stack = [startId];
    while (stack.length) {
      var cur = stack.pop();
      neighbors[cur].forEach(function (n) {
        if (b[n] === color && !stones.has(n)) { stones.add(n); stack.push(n); }
      });
    }
    var liberties = new Set();
    stones.forEach(function (s) {
      neighbors[s].forEach(function (n) { if (b[n] === null) liberties.add(n); });
    });
    return { stones: stones, liberties: liberties };
  }
  function opponent(c) { return c === "black" ? "white" : "black"; }

  function attemptMove(id) {
    if (gameOver) return;
    if (board[id] !== null) { log("此城市已被佔領，無法落子。", "illegal"); return; }
    var color = turn;
    var trial = cloneBoard(board);
    trial[id] = color;

    var capturedIds = [];
    var seen = new Set();
    neighbors[id].forEach(function (n) {
      if (trial[n] === opponent(color) && !seen.has(n)) {
        var g = getGroup(trial, n);
        g.stones.forEach(function (s) { seen.add(s); });
        if (g.liberties.size === 0) g.stones.forEach(function (s) { capturedIds.push(s); });
      }
    });
    capturedIds.forEach(function (s) { trial[s] = null; });

    var ownGroup = getGroup(trial, id);
    if (ownGroup.liberties.size === 0) {
      log("禁入（自殺手）：落在「" + nameOf(id) + "」會讓己方連塊立即無氣，且未能提對方子。", "illegal");
      return;
    }

    var candidateSnapshot = snapshotOf(trial);
    var koGuard = snapshotHistory[snapshotHistory.length - 2];
    if (koGuard !== undefined && candidateSnapshot === koGuard) {
      log("打劫：此手會立即重現前一回合之前的同型盤面，禁止落子於「" + nameOf(id) + "」。", "illegal");
      return;
    }

    board = trial;
    snapshotHistory.push(candidateSnapshot);
    if (capturedIds.length) {
      captures[color] += capturedIds.length;
      log(faction(color) + "於「" + nameOf(id) + "」落子，提" + faction(opponent(color)) + capturedIds.length + "子：" + capturedIds.map(nameOf).join("、") + "。", "capture");
    } else {
      log(faction(color) + "於「" + nameOf(id) + "」落子。氣：" + ownGroup.liberties.size + "。", "");
    }
    lastMove = { id: id, color: color };
    turn = opponent(color);
    render();
  }

  function nameOf(id) { return cityById[id] ? cityById[id].name : id; }
  function faction(color) { return color === "black" ? "契丹（黑）" : "中原（白）"; }

  function log(text, kind) {
    var ul = document.getElementById("log");
    var li = document.createElement("li");
    li.textContent = text;
    if (kind === "capture") li.className = "event-capture";
    if (kind === "illegal") li.className = "event-illegal";
    ul.insertBefore(li, ul.firstChild);
    while (ul.children.length > 60) ul.removeChild(ul.lastChild);
  }

  function computeTerritory() {
    var visited = new Set();
    var territory = { black: 0, white: 0 };
    order.forEach(function (id) {
      if (board[id] !== null || visited.has(id)) return;
      var region = new Set([id]);
      var stack = [id];
      var borders = new Set();
      visited.add(id);
      while (stack.length) {
        var cur = stack.pop();
        neighbors[cur].forEach(function (n) {
          if (board[n] === null) {
            if (!visited.has(n)) { visited.add(n); region.add(n); stack.push(n); }
          } else {
            borders.add(board[n]);
          }
        });
      }
      if (borders.size === 1) {
        var owner_ = borders.values().next().value;
        territory[owner_] += region.size;
      }
    });
    return territory;
  }

  // --- Leaflet map ---
  var bounds = L.latLngBounds(CITIES.map(function (c) { return [c.lat, c.lng]; }));
  var map = ListmapMapCore.createMap("map", { center: bounds.getCenter(), zoom: 7 });
  function fitToCities() { map.invalidateSize(); map.fitBounds(bounds, { padding: [40, 40] }); }
  fitToCities();
  setTimeout(fitToCities, 0);
  window.addEventListener("load", fitToCities);

  EDGES.forEach(function (e) {
    var a = cityById[e[0]], b = cityById[e[1]];
    L.polyline([[a.lat, a.lng], [b.lat, b.lng]], { color: "#c3b791", weight: 2, opacity: 0.9 }).addTo(map);
  });

  var markers = {};
  var lastMoveDot = null;

  CITIES.forEach(function (c) {
    var marker = L.circleMarker([c.lat, c.lng], {
      radius: c.hub ? 12 : 10,
      weight: c.hub ? 3 : 1.6,
      className: "city-node",
      fillColor: STYLE.empty.fillColor,
      color: STYLE.empty.color,
      fillOpacity: 1
    }).addTo(map);
    marker.bindTooltip(c.name, { permanent: true, direction: "top", offset: [0, -8], className: "city-tip" });
    marker.on("click", function () { attemptMove(c.id); });
    marker.on("mouseover", function () {
      if (board[c.id] === null && !gameOver) marker.setStyle({ color: "#c24d34" });
    });
    marker.on("mouseout", function () {
      if (board[c.id] === null && !gameOver) marker.setStyle({ color: STYLE.empty.color });
    });
    markers[c.id] = marker;
  });

  function render() {
    var libCache = {};
    order.forEach(function (id) {
      if (board[id] !== null && libCache[id] === undefined) {
        var g = getGroup(board, id);
        g.stones.forEach(function (s) { libCache[s] = g.liberties.size; });
      }
    });
    order.forEach(function (id) {
      var c = cityById[id];
      var marker = markers[id];
      if (board[id] === null) {
        marker.setStyle({ radius: c.hub ? 12 : 10, fillColor: STYLE.empty.fillColor, color: STYLE.empty.color, weight: c.hub ? 3 : 1.6 });
        marker.setTooltipContent(c.name);
      } else {
        var s = board[id] === "black" ? STYLE.black : STYLE.white;
        marker.setStyle({ radius: c.hub ? 13 : 11, fillColor: s.fillColor, color: s.color, weight: c.hub ? 2.6 : 1.5 });
        marker.setTooltipContent(c.name + "（氣：" + libCache[id] + "）");
      }
    });

    if (lastMoveDot) { map.removeLayer(lastMoveDot); lastMoveDot = null; }
    if (lastMove) {
      var lc = cityById[lastMove.id];
      lastMoveDot = L.circleMarker([lc.lat, lc.lng], {
        radius: 3, weight: 0, fillOpacity: 1,
        fillColor: lastMove.color === "black" ? STYLE.lastMoveBlack : STYLE.lastMoveWhite,
        interactive: false
      }).addTo(map);
    }

    document.getElementById("turnDot").className = "dot " + turn;
    document.getElementById("turnText").textContent = faction(turn);
    document.getElementById("capBlack").textContent = captures.black;
    document.getElementById("capWhite").textContent = captures.white;
  }

  function showScore() {
    var territory = computeTerritory();
    var totalBlack = territory.black + captures.black;
    var totalWhite = territory.white + captures.white;
    document.getElementById("territoryBlack").textContent = territory.black;
    document.getElementById("territoryWhite").textContent = territory.white;
    document.getElementById("tallyCapBlack").textContent = captures.black;
    document.getElementById("tallyCapWhite").textContent = captures.white;
    document.getElementById("totalBlack").textContent = totalBlack;
    document.getElementById("totalWhite").textContent = totalWhite;
    var verdict = document.getElementById("verdictText");
    if (totalBlack === totalWhite) {
      verdict.textContent = "平局";
    } else {
      verdict.textContent = (totalBlack > totalWhite ? "契丹（黑）" : "中原（白）") + "領先 " + Math.abs(totalBlack - totalWhite) + " 目";
    }
    document.getElementById("scoreOverlay").hidden = false;
  }

  document.getElementById("btnScore").addEventListener("click", showScore);
  document.getElementById("btnCloseScore").addEventListener("click", function () {
    document.getElementById("scoreOverlay").hidden = true;
  });
  document.getElementById("btnReset").addEventListener("click", function () {
    order.forEach(function (id) { board[id] = null; });
    turn = "black";
    captures = { black: 0, white: 0 };
    snapshotHistory = [snapshotOf(board)];
    lastMove = null;
    gameOver = false;
    document.getElementById("log").innerHTML = "";
    log("重新開始對局，契丹（黑）先行。", "");
    render();
  });

  log("對局開始，契丹（黑）先行。燕雲十六州已就位。", "");
  render();
})();
</script>
</body>
</html>
