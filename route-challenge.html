  <style>
    :root {
      --p: #3b5bdb; --p-light: #eef2ff;
      --ok: #2f9e44; --ok-light: #ebfbee;
      --line: #dee2e6; --ink: #212529; --ink-soft: #6c757d; --ink-faint: #adb5bd;
    }
    .col.right#route-panel { background: #f8f9fa; display: flex; flex-direction: column; overflow-y: auto; }
    .route-hud { padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
    .route-title-block { border-bottom: 1px solid var(--line); padding-bottom: 14px; }
    .route-title-block h2 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; margin: 0 0 4px; color: var(--ink); }
    .route-title-block p { font-size: 12.5px; color: var(--ink-soft); margin: 0; line-height: 1.6; }

    /* Distance display */
    .dist-panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .dist-label { font-size: 11px; color: var(--ink-faint); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
    .dist-value { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; color: var(--p); }
    .dist-ref { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

    /* Progress bar */
    .progress-bar-wrap { background: var(--line); border-radius: 999px; height: 6px; overflow: hidden; }
    .progress-bar-fill { background: var(--p); height: 100%; border-radius: 999px; transition: width .4s ease; }

    /* City list */
    .city-list { display: flex; flex-direction: column; gap: 4px; }
    .city-item { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; cursor: pointer; transition: background .1s, border-color .1s; font-size: 13px; }
    .city-item:hover { background: var(--p-light); border-color: var(--p); }
    .city-item.visited { background: var(--ok-light); border-color: var(--ok); color: var(--ok); cursor: default; }
    .city-item.visited:hover { background: var(--ok-light); border-color: var(--ok); }
    .city-item .city-num { font-size: 11px; font-weight: 700; color: var(--ink-faint); min-width: 16px; }
    .city-item.visited .city-num { color: var(--ok); }
    .city-item .city-flag { font-size: 14px; }
    .city-item .city-name { font-weight: 600; flex: 1; }
    .city-item .city-check { color: var(--ok); font-size: 14px; }
    .city-item .city-seg-dist { font-size: 11px; color: var(--ink-soft); margin-left: auto; }

    /* Buttons */
    .route-btn { font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: 700; border-radius: 9px; padding: 10px 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; width: 100%; transition: filter .12s; }
    .route-btn:hover { filter: brightness(0.96); }
    .route-btn.primary { background: var(--p); border-color: var(--p); color: #fff; }
    .route-btn.primary:hover { filter: brightness(1.1); }

    /* Result banner */
    .result-banner { background: var(--ok-light); border: 1px solid var(--ok); border-radius: 12px; padding: 14px 16px; display: none; }
    .result-banner.visible { display: block; }
    .result-banner h3 { font-family: 'Fraunces', serif; font-size: 17px; margin: 0 0 6px; color: var(--ok); }
    .result-banner p { font-size: 13px; color: var(--ink); margin: 0; }
    .result-highlight { font-weight: 700; color: var(--p); }
  </style>

<div class="containe-fluid" style="height:100%; width:100%;">
  <div class="row map-split" style="height:100%; width:100%;">
    <div id="map" class="col left"></div>
    <div class="col right" id="route-panel">
      <div class="route-hud">

        <div class="route-title-block">
          <h2>最短路線挑戰</h2>
          <p>依序點選 10 座城市，串起一條環遊世界的路線。目標是讓總距離盡可能短。</p>
        </div>

        <div class="dist-panel">
          <div class="dist-label">目前總距離</div>
          <div class="dist-value" id="distValue">0 km</div>
          <div class="dist-ref" id="distRef">已完成 <span id="visitedCount">0</span> / 10 站</div>
          <div class="progress-bar-wrap" style="margin-top:10px;">
            <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
          </div>
        </div>

        <div class="city-list" id="cityList"></div>

        <div class="result-banner" id="resultBanner">
          <h3>環線完成！</h3>
          <p id="resultText"></p>
        </div>

        <button class="route-btn" id="btnUndo" disabled>← 撤銷上一步</button>
        <button class="route-btn primary" id="btnReset">重新開始</button>

      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var CITIES = [
    { id: 0,  name: "台北",     flag: "🇹🇼", lat: 25.0330,  lng: 121.5654  },
    { id: 1,  name: "新竹",     flag: "🇹🇼", lat: 24.8036,  lng: 120.9686  },
    { id: 2,  name: "陽明山",   flag: "🇹🇼", lat: 25.1520,  lng: 121.5491  },
    { id: 3,  name: "東京",     flag: "🇯🇵", lat: 35.6895,  lng: 139.6917  },
    { id: 4,  name: "京都",     flag: "🇯🇵", lat: 35.0116,  lng: 135.7681  },
    { id: 5,  name: "大阪",     flag: "🇯🇵", lat: 34.6937,  lng: 135.5022  },
    { id: 6,  name: "海德堡",   flag: "🇩🇪", lat: 49.3988,  lng: 8.6724    },
    { id: 7,  name: "安錫",     flag: "🇫🇷", lat: 45.8992,  lng: 6.1294    },
    { id: 8,  name: "馬拉喀什", flag: "🇲🇦", lat: 31.6295,  lng: -7.9811   },
    { id: 9,  name: "可愛島",   flag: "🇺🇸", lat: 22.0964,  lng: -159.5261 }
  ];

  function haversine(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
    var a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  // Nearest-neighbor TSP from all starting points → best result as reference
  function nearestNeighbor(startIdx) {
    var unvisited = new Set(CITIES.map(function(c){ return c.id; }));
    var path = [startIdx], total = 0;
    unvisited.delete(startIdx);
    while (unvisited.size > 0) {
      var last = path[path.length-1];
      var best = { id: -1, d: Infinity };
      unvisited.forEach(function(id) {
        var d = haversine(CITIES[last].lat, CITIES[last].lng, CITIES[id].lat, CITIES[id].lng);
        if (d < best.d) best = { id: id, d: d };
      });
      total += best.d;
      path.push(best.id);
      unvisited.delete(best.id);
    }
    total += haversine(CITIES[path[path.length-1]].lat, CITIES[path[path.length-1]].lng, CITIES[startIdx].lat, CITIES[startIdx].lng);
    return total;
  }
  var REFERENCE_KM = (function() {
    var best = Infinity;
    for (var i = 0; i < CITIES.length; i++) best = Math.min(best, nearestNeighbor(i));
    return best;
  })();

  // State
  var visited = [];   // ordered array of city ids
  var totalDist = 0;
  var segDists = {};  // city_id -> dist from previous city (for display)

  // Map
  var allBounds = L.latLngBounds(CITIES.map(function(c){ return [c.lat, c.lng]; }));
  var map = ListmapMapCore.createMap("map", { center: allBounds.getCenter(), zoom: 2 });
  function fitMap(){ map.invalidateSize(); map.fitBounds(allBounds, { padding: [40, 40] }); }
  fitMap(); setTimeout(fitMap, 0); window.addEventListener("load", fitMap);

  var routeLine = null;
  var closingLine = null;
  var cityMarkers = {};
  var normalIcon = function(flag, active) {
    return L.divIcon({
      className: '',
      html: '<div style="font-size:20px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))">' + flag + '</div>',
      iconSize: [24, 24], iconAnchor: [12, 12]
    });
  };
  var visitedIcon = function(flag, num) {
    return L.divIcon({
      className: '',
      html: '<div style="position:relative;display:inline-block"><span style="font-size:20px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))">' + flag + '</span><span style="position:absolute;top:-6px;right:-6px;background:#2f9e44;color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;">' + num + '</span></div>',
      iconSize: [30, 24], iconAnchor: [12, 12]
    });
  };

  CITIES.forEach(function(c) {
    var m = L.marker([c.lat, c.lng], { icon: normalIcon(c.flag) }).addTo(map);
    m.bindTooltip(c.name, { direction: 'top', offset: [0, -10] });
    m.on('click', function() { visitCity(c.id); });
    cityMarkers[c.id] = m;
  });

  function visitCity(id) {
    if (visited.indexOf(id) !== -1) return;
    if (visited.length === CITIES.length) return;

    var prevId = visited.length > 0 ? visited[visited.length-1] : null;
    var dist = prevId !== null ? haversine(CITIES[prevId].lat, CITIES[prevId].lng, CITIES[id].lat, CITIES[id].lng) : 0;
    if (prevId !== null) totalDist += dist;
    segDists[id] = dist;

    visited.push(id);

    // Update marker
    cityMarkers[id].setIcon(visitedIcon(CITIES[id].flag, visited.length));

    // Update route line
    if (routeLine) map.removeLayer(routeLine);
    if (closingLine) { map.removeLayer(closingLine); closingLine = null; }
    if (visited.length >= 2) {
      var pts = visited.map(function(vid){ return [CITIES[vid].lat, CITIES[vid].lng]; });
      routeLine = L.polyline(pts, { color: '#3b5bdb', weight: 2.5, opacity: 0.85 }).addTo(map);
    }

    // If all visited, close the loop
    if (visited.length === CITIES.length) {
      var first = CITIES[visited[0]], last = CITIES[visited[visited.length-1]];
      var closeDist = haversine(last.lat, last.lng, first.lat, first.lng);
      totalDist += closeDist;
      closingLine = L.polyline([[last.lat, last.lng], [first.lat, first.lng]], { color: '#2f9e44', weight: 2, dashArray: '6 4', opacity: 0.9 }).addTo(map);
    }

    render();

    if (visited.length === CITIES.length) showResult();
  }

  function undoLast() {
    if (visited.length === 0) return;
    if (visited.length === CITIES.length) return; // Can't undo after complete
    var removedId = visited.pop();
    if (visited.length > 0 && segDists[removedId]) totalDist -= segDists[removedId];
    delete segDists[removedId];

    cityMarkers[removedId].setIcon(normalIcon(CITIES[removedId].flag));

    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (visited.length >= 2) {
      var pts = visited.map(function(vid){ return [CITIES[vid].lat, CITIES[vid].lng]; });
      routeLine = L.polyline(pts, { color: '#3b5bdb', weight: 2.5, opacity: 0.85 }).addTo(map);
    }
    render();
  }

  function render() {
    // Distance display
    document.getElementById('distValue').textContent = totalDist.toLocaleString() + ' km';
    document.getElementById('visitedCount').textContent = visited.length;
    document.getElementById('progressBar').style.width = (visited.length / CITIES.length * 100) + '%';
    document.getElementById('btnUndo').disabled = visited.length === 0 || visited.length === CITIES.length;

    // City list
    var listEl = document.getElementById('cityList');
    listEl.innerHTML = '';
    CITIES.forEach(function(c, idx) {
      var vIdx = visited.indexOf(c.id);
      var item = document.createElement('div');
      item.className = 'city-item' + (vIdx !== -1 ? ' visited' : '');
      var segTxt = (vIdx > 0 && segDists[c.id]) ? '+' + segDists[c.id].toLocaleString() + ' km' : '';
      item.innerHTML =
        '<span class="city-num">' + (vIdx !== -1 ? (vIdx+1) : (idx+1)) + '</span>' +
        '<span class="city-flag">' + c.flag + '</span>' +
        '<span class="city-name">' + c.name + '</span>' +
        (vIdx !== -1 ? '<span class="city-check">✓</span>' : '') +
        (segTxt ? '<span class="city-seg-dist">' + segTxt + '</span>' : '');
      if (vIdx === -1) item.addEventListener('click', function(){ visitCity(c.id); });
      listEl.appendChild(item);
    });
  }

  function showResult() {
    var pct = Math.round(REFERENCE_KM / totalDist * 100);
    var banner = document.getElementById('resultBanner');
    banner.className = 'result-banner visible';
    var msg = '你的路線：<span class="result-highlight">' + totalDist.toLocaleString() + ' km</span>。';
    if (totalDist <= REFERENCE_KM) {
      msg += '比貪婪演算法的 ' + REFERENCE_KM.toLocaleString() + ' km 還短！太強了！';
    } else {
      msg += '貪婪演算法參考值：' + REFERENCE_KM.toLocaleString() + ' km（你達到了 ' + pct + '%）。';
    }
    document.getElementById('resultText').innerHTML = msg;
    map.fitBounds(allBounds, { padding: [40, 40] });
  }

  function resetGame() {
    visited = []; totalDist = 0; segDists = {};
    CITIES.forEach(function(c){ cityMarkers[c.id].setIcon(normalIcon(c.flag)); });
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (closingLine) { map.removeLayer(closingLine); closingLine = null; }
    document.getElementById('resultBanner').className = 'result-banner';
    fitMap();
    render();
  }

  document.getElementById('btnReset').addEventListener('click', resetGame);
  document.getElementById('btnUndo').addEventListener('click', undoLast);

  render();
})();
</script>
</body>
