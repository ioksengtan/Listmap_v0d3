<!DOCTYPE html>
<html>
<head>
  <title>Listmap — 故事集</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .collection-card { cursor: pointer; transition: box-shadow 0.2s; }
    .collection-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .collection-card img { width: 100%; height: 160px; object-fit: cover; }
    .badge-private { background-color: #6c757d; }
    .badge-public { background-color: #0d6efd; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="index.html">Listmap</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
          <li class="nav-item"><a class="nav-link active" href="collections.html">故事集</a></li>
          <li class="nav-item"><a class="nav-link" href="stories.html">所有故事</a></li>
          <li class="nav-item"><a class="nav-link" href="find_stories.html">搜尋故事</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-4">故事集</h2>
    <div id="collections-grid" class="row g-4"></div>
  </div>

  <script>
    $.get('/api', { command: 'getCollections' }, function(data) {
      data.table.forEach(function(c) {
        var badge = c.visibility === 'public'
          ? '<span class="badge badge-public">公開</span>'
          : '<span class="badge badge-private">私人</span>';
        var card = `
          <div class="col-md-4">
            <div class="card collection-card h-100" onclick="window.location='collection.html?id=${c.collection_id}'">
              <img src="${c.cover_image}" alt="${c.title}" onerror="this.src='img/image0.png'">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-1">
                  <h5 class="card-title mb-0">${c.title}</h5>
                  ${badge}
                </div>
                <p class="card-text text-muted small">${c.description}</p>
                <p class="card-text"><small class="text-muted">${c.story_count} 個故事</small></p>
              </div>
            </div>
          </div>`;
        $('#collections-grid').append(card);
      });
    });
  </script>
</body>
</html>
